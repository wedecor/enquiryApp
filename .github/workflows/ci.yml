name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter (format, analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      # Only needed for Android builds; analyze/test do not require it.
      # Secret may hold the raw JSON or a base64-encoded copy.
      - name: Write google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          if echo "$GOOGLE_SERVICES_JSON" | base64 --decode > /tmp/gs.json 2>/dev/null && jq -e . /tmp/gs.json >/dev/null 2>&1; then
            mv /tmp/gs.json android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - run: flutter pub get

      - name: Check formatting (advisory)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

      - name: Web build
        run: flutter build web --release

  functions:
    name: Cloud Functions (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build

  rules:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json
      - run: npm ci
      # firebase-tools comes from rules-tests devDependencies; it finds ../firebase.json
      - run: npx firebase emulators:exec --only firestore --project demo-test "npm test"
